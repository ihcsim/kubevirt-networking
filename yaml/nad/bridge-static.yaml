apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: bridge-static
spec:
  config: |
    {
      "cniVersion": "1.1.0",
      "type": "bridge",
      "bridge": "stat0",
      "isGateway": true,
      "forceAddress": false,
      "hairpinMode": true,
      "ipam":
      {
        "type": "static",
        "addresses": [
          {
            "address": "172.168.30.20/24",
            "gateway": "172.168.30.1"
          }
        ],
        "routes": [
          { "dst": "0.0.0.0/0" }
        ],
        "dataDir": "/run/ipam/stat0"
      }
    }
